<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 背景圆 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="url(#bg)"/>
  <!-- 地球经线 -->
  <ellipse cx="24" cy="24" rx="13" ry="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <ellipse cx="24" cy="24" rx="6" ry="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <line x1="11" y1="24" x2="37" y2="24" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <line x1="24" y1="11" x2="24" y2="37" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <!-- 中心文字"灵" -->
  <text x="24" y="28.5" font-size="13" text-anchor="middle" fill="white"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">灵</text>
</svg>
