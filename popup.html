<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语灵灵</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, '微软雅黑', sans-serif;
      font-size: 13px;
      color: #1f2d3d;
      background: #fff;
    }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      background: linear-gradient(135deg, #1a5276, #2980b9);
      color: #fff;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-sub {
      font-size: 10px;
      opacity: 0.8;
      margin-left: auto;
    }

    /* 主按钮 */
    .main-btn {
      display: block;
      width: calc(100% - 28px);
      margin: 14px auto 0;
      padding: 10px;
      background: #2980b9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }

    .main-btn:hover { background: #1a5276; }
    .main-btn:active { background: #154360; }

    .main-btn.active {
      background: #e74c3c;
    }

    .main-btn.active:hover {
      background: #c0392b;
    }

    .main-btn:disabled {
      background: #aab7b8;
      cursor: not-allowed;
    }

    .pdf-btn {
      background: #6c3483;
      margin-top: 6px;
      font-size: 13px;
    }

    .pdf-btn:hover { background: #512e5f; }

    /* 状态栏 */
    .status {
      margin: 8px 14px 0;
      padding: 6px 10px;
      background: #f0f4f8;
      border-radius: 5px;
      font-size: 11px;
      color: #5d6d7e;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #bdc3c7;
      flex-shrink: 0;
    }

    .status-dot.on { background: #27ae60; }
    .status-dot.loading {
      background: #f39c12;
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 选项区 */
    .options {
      padding: 12px 14px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-label {
      font-size: 11px;
      color: #7f8c8d;
      width: 50px;
      flex-shrink: 0;
    }

    select {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      font-size: 12px;
      color: #1f2d3d;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: #2980b9;
    }

    /* 分割线 */
    .divider {
      margin: 12px 14px 0;
      border: none;
      border-top: 1px solid #eaecef;
    }

    /* 页脚 */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px 12px;
      font-size: 11px;
      color: #8b949e;
    }

    .footer a {
      color: #0969da;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover { text-decoration: underline; }

    .privacy-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #27ae60;
    }

    .privacy-badge::before {
      content: '🔒';
      font-size: 10px;
    }

    /* 快捷键提示 */
    kbd {
      display: inline-block;
      padding: 1px 5px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 3px;
      font-size: 10px;
      font-family: monospace;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🌐</span>
    <span class="header-title">语灵灵</span>
    <span class="header-sub">隐私优先双语翻译</span>
  </div>

  <button class="main-btn" id="btnTranslate">翻译当前页面</button>

  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">准备就绪 · <kbd>Alt+T</kbd> 快捷键</span>
  </div>

  <div class="options">
    <div class="option-row">
      <span class="option-label">目标语言</span>
      <select id="selLang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <div class="option-row">
      <span class="option-label">翻译引擎</span>
      <select id="selEngine">
        <optgroup label="免费引擎（无需Key）">
          <option value="google">Google Translate ⭐</option>
          <option value="mymemory">MyMemory（备用）</option>
          <option value="libretranslate">LibreTranslate（开源）</option>
        </optgroup>
        <optgroup label="高质量引擎（需配置Key）">
          <option value="deepl">DeepL（免费5M字/月）</option>
          <option value="deepseek">DeepSeek（极低成本）</option>
          <option value="openai">OpenAI GPT</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="footer">
    <a id="btnOptions" href="#">⚙️ 设置 / API Key</a>
    <span class="privacy-badge">直连翻译，数据不经中间服务器</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
