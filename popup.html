<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenImmersive Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, '微软雅黑', sans-serif;
      font-size: 13px;
      color: #1c1917;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #fff;
    }
    .header img { width: 24px; height: 24px; border-radius: 5px; }
    .header-title { font-size: 15px; font-weight: 700; }

    .main-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 16px auto 0;
      padding: 12px;
      background: #0d9488;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }
    .main-btn:hover { background: #0f766e; }
    .main-btn.active { background: #e11d48; }
    .main-btn.active:hover { background: #be123c; }
    .main-btn:disabled { background: #d6d3d1; cursor: not-allowed; }

    .status {
      margin: 10px 16px 0;
      font-size: 11px;
      color: #78716c;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 16px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #d6d3d1; flex-shrink: 0; }
    .status-dot.on { background: #16a34a; }
    .status-dot.loading { background: #f59e0b; animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    .rows { padding: 14px 16px 4px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row-label { font-size: 13px; color: #44403c; }

    select {
      padding: 6px 10px;
      border: 1px solid #d6d3d1;
      border-radius: 6px;
      font-size: 13px;
      color: #1c1917;
      background: #fff;
      cursor: pointer;
      outline: none;
      min-width: 130px;
    }
    select:focus { border-color: #0d9488; }

    /* 开关 */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #d6d3d1; border-radius: 22px; transition: .18s;
    }
    .slider::before {
      content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .18s;
    }
    input:checked + .slider { background: #0d9488; }
    input:checked + .slider::before { transform: translateX(18px); }

    .hint { padding: 2px 16px 0; font-size: 11px; color: #a8a29e; }
    kbd {
      display: inline-block; padding: 1px 5px; background: #f5f5f4;
      border: 1px solid #e7e5e4; border-radius: 3px; font-size: 10px;
      font-family: monospace; color: #57534e;
    }

    hr { margin: 12px 16px 0; border: none; border-top: 1px solid #f0efed; }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px 14px; font-size: 12px;
    }
    .footer a { color: #0d9488; text-decoration: none; cursor: pointer; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="" />
    <span class="header-title">OpenImmersive Translator</span>
  </div>

  <button class="main-btn" id="btnTranslate">翻译此页</button>

  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText"></span>
  </div>

  <div class="rows">
    <div class="row">
      <span class="row-label">翻译成</span>
      <select id="selLang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <div class="row">
      <span class="row-label">悬停翻译（按住 Alt 划过段落）</span>
      <label class="switch"><input type="checkbox" id="swHover" /><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="row-label">总是翻译此网站</span>
      <label class="switch"><input type="checkbox" id="swAutoSite" /><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="row-label">页面悬浮球</span>
      <label class="switch"><input type="checkbox" id="swFloatBall" /><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="row-label">总是翻译<span id="autoLangName">该语言</span></span>
      <label class="switch"><input type="checkbox" id="swAutoLang" /><span class="slider"></span></label>
    </div>
  </div>

  <div class="hint">快捷键：<kbd>Alt+T</kbd> 整页 · 选中即翻 · 输入框 <kbd>Alt+Enter</kbd> 译成外语</div>

  <hr />

  <div class="footer">
    <a id="btnPdf" href="#">翻译 PDF 文件 →</a>
    <a id="btnOptions" href="#">更多设置</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
